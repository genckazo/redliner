<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juniper Coffee</title>
<style>
  body { margin: 0; font-family: Georgia, serif; background: #f6f1e7; color: #2b2118; }
  header { padding: 48px 64px 24px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p.tagline { font-size: 16px; margin: 0; color: #6b5a48; }
  main { padding: 24px 64px; display: flex; gap: 24px; }
  .card { background: #fff; border: 1px solid #e2d8c6; border-radius: 10px; padding: 20px; width: 220px; }
  .card h2 { font-size: 18px; margin: 0 0 6px; }
  .price { color: #8a5a2b; font-weight: bold; }
  button { margin: 24px 64px; padding: 10px 18px; font-size: 14px; border: 0; border-radius: 6px; background: #8a8a8a; color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Juniper Coffee</h1>
  <p class="tagline">Small-batch beans, roasted on Tuesdays.</p>
</header>
<main>
  <div class="card"><h2>House Blend</h2><p>Chocolate, hazelnut, a little orange.</p><p class="price">$14</p></div>
  <div class="card"><h2>Night Shift</h2><p>Dark roast for people with deadlines.</p><p class="price">$16</p></div>
  <div class="card"><h2>First Light</h2><p>Bright and floral, best as pour-over.</p><p class="price">$17</p></div>
</main>
<button>Order beans</button>
</body>
</html>
